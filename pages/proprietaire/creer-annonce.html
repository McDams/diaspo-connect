<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une annonce — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=22" rel="stylesheet">
  <link href="../../assets/css/base.css?v=22" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=22" rel="stylesheet">
  <link href="../../assets/css/components.css?v=22" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=22" rel="stylesheet">
</head>
<body data-page="creer-annonce">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Créer une annonce</h1>
      <p class="text-body-secondary mb-4">Votre annonce sera vérifiée par notre équipe avant d'être visible publiquement.</p>

      <form id="listing-form" class="dc-form-section" novalidate>
        <h6 class="mb-3"><i class="bi bi-house me-2"></i>Informations générales</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-8">
            <label for="title" class="form-label dc-required">Titre de l'annonce</label>
            <input type="text" class="form-control" id="title" name="title" placeholder="Ex : Studio meublé proche campus" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-4">
            <label for="type" class="form-label dc-required">Type de logement</label>
            <select class="form-select" id="type" name="type" required>
              <option value="">Choisir…</option>
              <option>Studio</option><option>Chambre chez l'habitant</option><option>Colocation</option><option>T1</option><option>T2</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label for="city" class="form-label dc-required">Ville</label>
            <input type="text" class="form-control" id="city" name="city" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label for="surface" class="form-label dc-required">Surface (m²)</label>
            <input type="number" class="form-control" id="surface" name="surface" min="5" required>
            <div class="invalid-feedback"></div>
          </div>
        </div>

        <h6 class="mb-3"><i class="bi bi-cash-coin me-2"></i>Conditions financières</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label for="budget" class="form-label dc-required">Loyer mensuel (€)</label>
            <input type="number" class="form-control" id="budget" name="budget" min="100" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-4">
            <label for="charges" class="form-label">Charges (€/mois)</label>
            <input type="number" class="form-control" id="charges" name="charges" min="0" value="0">
          </div>
          <div class="col-md-4">
            <label for="deposit" class="form-label dc-required">Dépôt de garantie (€)</label>
            <input type="number" class="form-control" id="deposit" name="deposit" min="0" required>
            <div class="invalid-feedback"></div>
          </div>
        </div>

        <h6 class="mb-3"><i class="bi bi-calendar-check me-2"></i>Disponibilité</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="availableFrom" class="form-label dc-required">Disponible à partir du</label>
            <input type="date" class="form-control" id="availableFrom" name="availableFrom" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6 d-flex align-items-end">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="immediateAvailability" name="immediateAvailability">
              <label class="form-check-label" for="immediateAvailability">Disponible immédiatement</label>
            </div>
          </div>
        </div>

        <h6 class="mb-3"><i class="bi bi-stars me-2"></i>Équipements</h6>
        <div class="row g-3 mb-4">
          <div class="col-12 d-flex flex-wrap gap-3">
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenities" value="Meublé" id="am1"><label class="form-check-label" for="am1">Meublé</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenities" value="Internet inclus" id="am2"><label class="form-check-label" for="am2">Internet inclus</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenities" value="Proche tram" id="am3"><label class="form-check-label" for="am3">Proche transports</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenities" value="Laverie" id="am4"><label class="form-check-label" for="am4">Laverie</label></div>
            <div class="form-check"><input class="form-check-input" type="checkbox" name="amenities" value="Balcon" id="am5"><label class="form-check-label" for="am5">Balcon</label></div>
          </div>
        </div>

        <h6 class="mb-3"><i class="bi bi-card-image me-2"></i>Photos</h6>
        <div class="mb-4">
          <input type="file" class="form-control" multiple disabled>
          <div class="form-text">Simulation de prototype : l'envoi de photos réelles sera activé avec le backend.</div>
        </div>

        <h6 class="mb-3"><i class="bi bi-card-text me-2"></i>Description &amp; conditions</h6>
        <div class="mb-4">
          <label for="description" class="form-label dc-required">Description</label>
          <textarea class="form-control" id="description" name="description" rows="4" required></textarea>
          <div class="invalid-feedback"></div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-outline-secondary" data-mode="draft">Enregistrer comme brouillon</button>
          <button type="submit" class="btn btn-primary">Soumettre à la modération</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=22"></script>
  <script src="../../assets/js/core/audit.js?v=22"></script>
  <script src="../../assets/js/core/utils.js?v=22"></script>
  <script src="../../assets/js/core/auth.js?v=22"></script>
  <script src="../../assets/js/core/notification-center.js?v=22"></script>
  <script src="../../assets/js/ui/forms.js?v=22"></script>
  <script src="../../assets/js/ui/layout.js?v=22"></script>
  <script src="../../assets/js/pages/page-proprietaire-creer-annonce.js?v=22"></script>
</body>
</html>
