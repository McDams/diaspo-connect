<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord propriétaire — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=10" rel="stylesheet">
  <link href="../../assets/css/base.css?v=10" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=10" rel="stylesheet">
  <link href="../../assets/css/components.css?v=10" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=10" rel="stylesheet">
</head>
<body data-page="dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
          <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span> !</h1>
          <p class="text-body-secondary mb-0">Gérez vos annonces de logement destinées aux étudiants.</p>
        </div>
        <a href="creer-annonce.html" class="btn btn-primary"><i class="bi bi-plus-circle me-1"></i>Nouvelle annonce</a>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-3">
          <div class="dc-stat-card d-flex align-items-center gap-3">
            <div class="dc-stat-icon dc-icon-teal"><i class="bi bi-house-check"></i></div>
            <div><div class="dc-stat-value" id="kpi-published">-</div><div class="dc-stat-label">Annonces publiées</div></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="dc-stat-card d-flex align-items-center gap-3">
            <div class="dc-stat-icon dc-icon-warning"><i class="bi bi-hourglass-split"></i></div>
            <div><div class="dc-stat-value" id="kpi-pending">-</div><div class="dc-stat-label">En attente de modération</div></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="dc-stat-card d-flex align-items-center gap-3">
            <div class="dc-stat-icon dc-icon-danger"><i class="bi bi-x-circle"></i></div>
            <div><div class="dc-stat-value" id="kpi-rejected">-</div><div class="dc-stat-label">Rejetées</div></div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="dc-stat-card d-flex align-items-center gap-3">
            <div class="dc-stat-icon dc-icon-navy"><i class="bi bi-collection"></i></div>
            <div><div class="dc-stat-value" id="kpi-total">-</div><div class="dc-stat-label">Annonces au total</div></div>
          </div>
        </div>
      </div>

      <h6 class="mb-3">Mes dernières annonces</h6>
      <div class="row g-3" id="listings-grid"><div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=10"></script>
  <script src="../../assets/js/core/utils.js?v=10"></script>
  <script src="../../assets/js/core/auth.js?v=10"></script>
  <script src="../../assets/js/core/notification-center.js?v=10"></script>
  <script src="../../assets/js/ui/layout.js?v=10"></script>
  <script src="../../assets/js/pages/page-proprietaire-dashboard.js?v=10"></script>
</body>
</html>
