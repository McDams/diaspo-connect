<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon profil — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=2" rel="stylesheet">
  <link href="../../assets/css/base.css?v=2" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=2" rel="stylesheet">
  <link href="../../assets/css/components.css?v=2" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=2" rel="stylesheet">
</head>
<body data-page="profil">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
        <div>
          <h1 class="h4 mb-1">Mon profil</h1>
          <p class="text-body-secondary mb-0">Ces informations sont utilisées pour calculer vos compatibilités de parrainage.</p>
        </div>
        <span id="file-status-badge"></span>
      </div>

      <div class="row g-4">
        <div class="col-lg-3">
          <div class="dc-card p-3 text-center">
            <div class="dc-completeness-ring mx-auto mb-2" id="completeness-ring"><span id="completeness-value">0%</span></div>
            <p class="small text-muted-dc mb-0">Score de complétude du profil</p>
          </div>
        </div>
        <div class="col-lg-9">
          <form id="profile-form" class="dc-form-section" novalidate>
            <h6 class="mb-3"><i class="bi bi-person me-2"></i>Informations personnelles</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">Prénom</label>
                <input type="text" class="form-control" name="firstName" disabled>
              </div>
              <div class="col-md-6">
                <label class="form-label">Nom</label>
                <input type="text" class="form-control" name="lastName" disabled>
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" disabled>
              </div>
              <div class="col-md-6">
                <label class="form-label">Téléphone</label>
                <input type="tel" class="form-control" name="phone" disabled>
              </div>
              <div class="col-md-6">
                <label for="cityOfOrigin" class="form-label">Ville d'origine</label>
                <input type="text" class="form-control" id="cityOfOrigin" name="cityOfOrigin">
              </div>
            </div>

            <h6 class="mb-3"><i class="bi bi-mortarboard me-2"></i>Projet d'études</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="desiredCity" class="form-label dc-required">Ville souhaitée en France</label>
                <input type="text" class="form-control" id="desiredCity" name="desiredCity" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="school" class="form-label">Établissement visé</label>
                <input type="text" class="form-control" id="school" name="school">
              </div>
              <div class="col-md-6">
                <label for="studyField" class="form-label dc-required">Domaine d'étude</label>
                <select class="form-select" id="studyField" name="studyField" required>
                  <option>Informatique</option><option>Data Science</option><option>Gestion</option><option>Droit</option>
                  <option>Ingénierie civile</option><option>Marketing</option><option>Médecine</option><option>Biologie</option><option>Sciences politiques</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="budget" class="form-label dc-required">Budget logement mensuel (€)</label>
                <input type="number" class="form-control" id="budget" name="budget" min="200" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-12">
                <label class="form-label">Langues parlées</label>
                <div class="d-flex flex-wrap gap-3 pt-2">
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="languages" value="Français" id="lang-fr"><label class="form-check-label" for="lang-fr">Français</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="languages" value="Fon" id="lang-fon"><label class="form-check-label" for="lang-fon">Fon</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="languages" value="Anglais" id="lang-en"><label class="form-check-label" for="lang-en">Anglais</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="languages" value="Yoruba" id="lang-yo"><label class="form-check-label" for="lang-yo">Yoruba</label></div>
                </div>
              </div>
            </div>

            <h6 class="mb-3"><i class="bi bi-people me-2"></i>Préférences d'accompagnement</h6>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="sexPreference" class="form-label">Préférence de sexe du parrain/marraine</label>
                <select class="form-select" id="sexPreference" name="sexPreference">
                  <option value="aucune">Aucune préférence</option>
                  <option value="femme">Femme</option>
                  <option value="homme">Homme</option>
                </select>
                <div class="form-text">Vous êtes seul(e) à pouvoir définir ce critère.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Type d'accompagnement recherché</label>
                <div class="d-flex flex-wrap gap-3 pt-2">
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="accompagnementType" value="démarches administratives" id="acc-1"><label class="form-check-label" for="acc-1">Démarches</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="accompagnementType" value="logement" id="acc-2"><label class="form-check-label" for="acc-2">Logement</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="accompagnementType" value="vie quotidienne" id="acc-3"><label class="form-check-label" for="acc-3">Vie quotidienne</label></div>
                  <div class="form-check"><input class="form-check-input" type="checkbox" name="accompagnementType" value="orientation études" id="acc-4"><label class="form-check-label" for="acc-4">Orientation études</label></div>
                </div>
              </div>
              <div class="col-12">
                <label for="specificNeeds" class="form-label">Besoins spécifiques</label>
                <textarea class="form-control" id="specificNeeds" name="specificNeeds" rows="2"></textarea>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=2"></script>
  <script src="../../assets/js/core/utils.js?v=2"></script>
  <script src="../../assets/js/core/auth.js?v=2"></script>
  <script src="../../assets/js/core/notification-center.js?v=2"></script>
  <script src="../../assets/js/ui/forms.js?v=2"></script>
  <script src="../../assets/js/ui/layout.js?v=2"></script>
  <script src="../../assets/js/pages/page-filleul-profil.js?v=2"></script>
</body>
</html>
