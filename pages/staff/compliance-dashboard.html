<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Conformité — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=16" rel="stylesheet">
  <link href="../../assets/css/base.css?v=16" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=16" rel="stylesheet">
  <link href="../../assets/css/components.css?v=16" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=16" rel="stylesheet">
</head>
<body data-page="compliance-dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span></h1>
      <p class="text-body-secondary mb-4">Vérification des profils et conformité des annonces.</p>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-person-badge"></i></div><div class="dc-stat-value" id="kpi-to-verify">-</div><div class="dc-stat-label">Profils à vérifier</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-file-earmark-check"></i></div><div class="dc-stat-value" id="kpi-pending-docs">-</div><div class="dc-stat-label">Annonces à contrôler</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-danger mb-2"><i class="bi bi-person-x"></i></div><div class="dc-stat-value" id="kpi-suspended">-</div><div class="dc-stat-label">Comptes suspendus</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-patch-check"></i></div><div class="dc-stat-value" id="kpi-verified-mentors">-</div><div class="dc-stat-label">Mentors vérifiés actifs</div></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-person-badge text-warning me-2"></i>Profils à vérifier</h6>
            <div class="table-responsive">
              <table class="table dc-table mb-0 align-middle">
                <thead><tr><th>Utilisateur</th><th>Rôle</th><th>Ville</th><th>Inscrit le</th></tr></thead>
                <tbody id="to-verify-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-person-x text-danger me-2"></i>Comptes suspendus</h6>
            <div class="table-responsive">
              <table class="table dc-table mb-0 align-middle">
                <thead><tr><th>Utilisateur</th><th>Rôle</th><th>Statut</th></tr></thead>
                <tbody id="suspended-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=16"></script>
  <script src="../../assets/js/core/audit.js?v=16"></script>
  <script src="../../assets/js/core/utils.js?v=16"></script>
  <script src="../../assets/js/core/auth.js?v=16"></script>
  <script src="../../assets/js/core/permissions.js?v=16"></script>
  <script src="../../assets/js/core/staff-guard.js?v=16"></script>
  <script src="../../assets/js/core/notification-center.js?v=16"></script>
  <script src="../../assets/js/ui/layout.js?v=16"></script>
  <script src="../../assets/js/pages/page-compliance-dashboard.js?v=16"></script>
</body>
</html>
