<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Modération — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=20" rel="stylesheet">
  <link href="../../assets/css/base.css?v=20" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=20" rel="stylesheet">
  <link href="../../assets/css/components.css?v=20" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=20" rel="stylesheet">
</head>
<body data-page="moderation-dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span></h1>
      <p class="text-body-secondary mb-4">Modération &amp; confiance : sécurité des échanges et des profils.</p>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-danger mb-2"><i class="bi bi-flag"></i></div><div class="dc-stat-value" id="kpi-open-reports">-</div><div class="dc-stat-label">Signalements ouverts</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-danger mb-2"><i class="bi bi-chat-square-text"></i></div><div class="dc-stat-value" id="kpi-flagged-messages">-</div><div class="dc-stat-label">Messages suspects</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-person-exclamation"></i></div><div class="dc-stat-value" id="kpi-to-review">-</div><div class="dc-stat-label">Comptes à revoir</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-check2-square"></i></div><div class="dc-stat-value" id="kpi-decided">-</div><div class="dc-stat-label">Décisions prises</div></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="dc-card p-3 mb-4">
            <h6 class="mb-3"><i class="bi bi-flag text-danger me-2"></i>Signalements à traiter</h6>
            <div id="reports-list"></div>
            <a href="tickets-management.html" class="small d-block mt-2">Traiter via le centre de tickets <i class="bi bi-arrow-right"></i></a>
          </div>
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-person-exclamation text-warning me-2"></i>Comptes à revoir</h6>
            <div id="accounts-review-list"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="dc-card p-3 mb-4">
            <h6 class="mb-3"><i class="bi bi-chat-square-text text-danger me-2"></i>Messages suspects</h6>
            <div id="flagged-messages-list"></div>
          </div>
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-check2-square text-teal me-2"></i>Décisions de modération récentes</h6>
            <div id="decisions-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=20"></script>
  <script src="../../assets/js/core/audit.js?v=20"></script>
  <script src="../../assets/js/core/utils.js?v=20"></script>
  <script src="../../assets/js/core/auth.js?v=20"></script>
  <script src="../../assets/js/core/permissions.js?v=20"></script>
  <script src="../../assets/js/core/staff-guard.js?v=20"></script>
  <script src="../../assets/js/core/notification-center.js?v=20"></script>
  <script src="../../assets/js/ui/layout.js?v=20"></script>
  <script src="../../assets/js/pages/page-moderation-dashboard.js?v=20"></script>
</body>
</html>
