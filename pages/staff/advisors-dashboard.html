<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Conseil — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=20" rel="stylesheet">
  <link href="../../assets/css/base.css?v=20" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=20" rel="stylesheet">
  <link href="../../assets/css/components.css?v=20" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=20" rel="stylesheet">
</head>
<body data-page="advisors-dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span></h1>
      <p class="text-body-secondary mb-4">Vos dossiers en <span id="domain-label" class="fw-semibold">-</span>.</p>

      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-terracotta mb-2"><i class="bi bi-folder2-open"></i></div><div class="dc-stat-value" id="kpi-assigned">-</div><div class="dc-stat-label">Dossiers affectés en cours</div></div>
        </div>
        <div class="col-md-6">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-check2-circle"></i></div><div class="dc-stat-value" id="kpi-resolved">-</div><div class="dc-stat-label">Dossiers résolus</div></div>
        </div>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-lg-8">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-folder2-open text-primary me-2"></i>Mes dossiers</h6>
            <div class="table-responsive">
              <table class="table dc-table mb-0 align-middle">
                <thead><tr><th>Réf.</th><th>Mentoré</th><th>Catégorie</th><th>Priorité</th><th>Statut</th><th></th></tr></thead>
                <tbody id="assigned-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="dc-card p-3 h-100">
            <h6 class="mb-3"><i class="bi bi-calendar-event text-primary me-2"></i>Entretiens à prévoir</h6>
            <div id="meetings-list"></div>
          </div>
        </div>
      </div>

      <div class="row g-4 d-none" id="section-demarches">
        <div class="col-12">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-list-check text-primary me-2"></i>Checklists des mentorés suivis</h6>
            <div id="checklist-followup"></div>
          </div>
        </div>
      </div>

      <div class="row g-4 d-none" id="section-logement">
        <div class="col-lg-6">
          <div class="dc-card p-3 h-100">
            <h6 class="mb-3"><i class="bi bi-house-check text-primary me-2"></i>Annonces adaptées</h6>
            <div id="housing-adapted"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="dc-card p-3 h-100">
            <h6 class="mb-3"><i class="bi bi-exclamation-triangle text-danger me-2"></i>Alertes arnaque potentielle</h6>
            <div id="scam-alerts"></div>
          </div>
        </div>
      </div>

      <div class="row g-4 d-none" id="section-emploi">
        <div class="col-12">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-briefcase text-primary me-2"></i>Offres recommandées</h6>
            <div id="opp-recommended"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=20"></script>
  <script src="../../assets/js/core/audit.js?v=20"></script>
  <script src="../../assets/js/core/utils.js?v=20"></script>
  <script src="../../assets/js/core/auth.js?v=20"></script>
  <script src="../../assets/js/core/permissions.js?v=20"></script>
  <script src="../../assets/js/core/staff-guard.js?v=20"></script>
  <script src="../../assets/js/core/notification-center.js?v=20"></script>
  <script src="../../assets/js/core/ticket-helpers.js?v=20"></script>
  <script src="../../assets/js/ui/layout.js?v=20"></script>
  <script src="../../assets/js/pages/page-advisors-dashboard.js?v=20"></script>
</body>
</html>
