<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Contenu — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=3" rel="stylesheet">
  <link href="../../assets/css/base.css?v=3" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
  <link href="../../assets/css/components.css?v=3" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=3" rel="stylesheet">
</head>
<body data-page="content-dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span></h1>
      <p class="text-body-secondary mb-4">Contenu &amp; ressources : guides, FAQ et communication.</p>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-journal-richtext"></i></div><div class="dc-stat-value" id="kpi-guides">-</div><div class="dc-stat-label">Guides pratiques</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-question-circle"></i></div><div class="dc-stat-value" id="kpi-faqs">-</div><div class="dc-stat-label">Questions FAQ</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-danger mb-2"><i class="bi bi-clock-history"></i></div><div class="dc-stat-value" id="kpi-stale">-</div><div class="dc-stat-label">Contenu à mettre à jour</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-calendar-check"></i></div><div class="dc-stat-value" id="kpi-last-update">-</div><div class="dc-stat-label">Dernière mise à jour</div></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-5">
          <div class="dc-card p-3 h-100">
            <h6 class="mb-3"><i class="bi bi-clock-history text-danger me-2"></i>Contenu à mettre à jour</h6>
            <div id="stale-list"></div>
          </div>
        </div>
        <div class="col-lg-7">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-journal-richtext text-primary me-2"></i>Tout le contenu</h6>
            <div class="table-responsive">
              <table class="table dc-table mb-0 align-middle">
                <thead><tr><th>Titre</th><th>Catégorie</th><th>Mis à jour</th></tr></thead>
                <tbody id="all-content-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=3"></script>
  <script src="../../assets/js/core/utils.js?v=3"></script>
  <script src="../../assets/js/core/auth.js?v=3"></script>
  <script src="../../assets/js/core/permissions.js?v=3"></script>
  <script src="../../assets/js/core/staff-guard.js?v=3"></script>
  <script src="../../assets/js/core/notification-center.js?v=3"></script>
  <script src="../../assets/js/ui/layout.js?v=3"></script>
  <script src="../../assets/js/pages/page-content-dashboard.js?v=3"></script>
</body>
</html>
