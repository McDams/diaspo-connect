<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Partenariats — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=20" rel="stylesheet">
  <link href="../../assets/css/base.css?v=20" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=20" rel="stylesheet">
  <link href="../../assets/css/components.css?v=20" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=20" rel="stylesheet">
</head>
<body data-page="partnerships-dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span></h1>
      <p class="text-body-secondary mb-4">Partenariats : prospects, partenaires actifs et demandes de collaboration.</p>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-purple mb-2"><i class="bi bi-person-plus"></i></div><div class="dc-stat-value" id="kpi-prospects">-</div><div class="dc-stat-label">Prospects en cours</div></div>
        </div>
        <div class="col-md-4">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-briefcase"></i></div><div class="dc-stat-value" id="kpi-active-partners">-</div><div class="dc-stat-label">Partenaires actifs</div></div>
        </div>
        <div class="col-md-4">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-navy mb-2"><i class="bi bi-envelope-paper"></i></div><div class="dc-stat-value" id="kpi-collab-requests">-</div><div class="dc-stat-label">Demandes de collaboration (total)</div></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-person-plus text-primary me-2"></i>Prospects &amp; suivi des contacts</h6>
            <div class="table-responsive">
              <table class="table dc-table mb-0 align-middle">
                <thead><tr><th>Réf.</th><th>Organisation</th><th>Email</th><th>Statut</th><th></th></tr></thead>
                <tbody id="prospects-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="dc-card p-3 h-100">
            <h6 class="mb-3"><i class="bi bi-briefcase text-primary me-2"></i>Partenaires actifs</h6>
            <div id="active-partners-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=20"></script>
  <script src="../../assets/js/core/audit.js?v=20"></script>
  <script src="../../assets/js/core/utils.js?v=20"></script>
  <script src="../../assets/js/core/auth.js?v=20"></script>
  <script src="../../assets/js/core/permissions.js?v=20"></script>
  <script src="../../assets/js/core/staff-guard.js?v=20"></script>
  <script src="../../assets/js/core/notification-center.js?v=20"></script>
  <script src="../../assets/js/ui/layout.js?v=20"></script>
  <script src="../../assets/js/pages/page-partnerships-dashboard.js?v=20"></script>
</body>
</html>
