<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Technique — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=2" rel="stylesheet">
  <link href="../../assets/css/base.css?v=2" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=2" rel="stylesheet">
  <link href="../../assets/css/components.css?v=2" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=2" rel="stylesheet">
</head>
<body data-page="technical-dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span></h1>
      <p class="text-body-secondary mb-4">Supervision technique de la plateforme (données simulées).</p>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="dc-card p-3 mb-4">
            <h6 class="mb-3"><i class="bi bi-cpu text-primary me-2"></i>États des modules</h6>
            <div id="modules-list"></div>
          </div>
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-tools text-primary me-2"></i>Maintenance</h6>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="maintenance-toggle">
              <label class="form-check-label" for="maintenance-toggle">Activer le mode maintenance (simulation)</label>
            </div>
            <p class="small text-muted-dc mt-2 mb-0">En production, ce mode afficherait une page d'attente aux visiteurs le temps d'une opération technique.</p>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-terminal text-primary me-2"></i>Journaux système (simulés)</h6>
            <div id="logs-list" style="max-height: 420px; overflow-y:auto;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=2"></script>
  <script src="../../assets/js/core/utils.js?v=2"></script>
  <script src="../../assets/js/core/auth.js?v=2"></script>
  <script src="../../assets/js/core/permissions.js?v=2"></script>
  <script src="../../assets/js/core/staff-guard.js?v=2"></script>
  <script src="../../assets/js/core/notification-center.js?v=2"></script>
  <script src="../../assets/js/ui/layout.js?v=2"></script>
  <script src="../../assets/js/pages/page-technical-dashboard.js?v=2"></script>
</body>
</html>
