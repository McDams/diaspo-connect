<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire interne — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=10" rel="stylesheet">
  <link href="../../assets/css/base.css?v=10" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=10" rel="stylesheet">
  <link href="../../assets/css/components.css?v=10" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=10" rel="stylesheet">
</head>
<body data-page="staff-directory">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Annuaire interne</h1>
      <p class="text-body-secondary mb-3">Tous les membres de l'équipe, quel que soit leur niveau de visibilité publique.</p>

      <form id="filters-form" class="dc-filter-panel mb-3">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="f-recherche" class="form-label">Recherche</label>
            <input type="search" id="f-recherche" class="form-control" placeholder="Nom, poste...">
          </div>
          <div class="col-md-4">
            <label for="f-departement" class="form-label">Pôle</label>
            <select id="f-departement" class="form-select"><option value="all">Tous les pôles</option></select>
          </div>
          <div class="col-md-4">
            <label for="f-status" class="form-label">Statut</label>
            <select id="f-status" class="form-select">
              <option value="all">Tous statuts</option>
              <option value="bénévole">Bénévole</option>
              <option value="actif">Actif</option>
              <option value="en pause">En pause</option>
              <option value="prestataire">Prestataire</option>
              <option value="permanent">Permanent</option>
              <option value="en formation">En formation</option>
              <option value="suspendu">Suspendu</option>
              <option value="archivé">Archivé</option>
            </select>
          </div>
        </div>
      </form>

      <span id="results-count" class="small text-muted-dc d-block mb-2"></span>
      <div class="row g-3" id="staff-grid"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=10"></script>
  <script src="../../assets/js/core/utils.js?v=10"></script>
  <script src="../../assets/js/core/auth.js?v=10"></script>
  <script src="../../assets/js/core/permissions.js?v=10"></script>
  <script src="../../assets/js/core/staff-guard.js?v=10"></script>
  <script src="../../assets/js/core/notification-center.js?v=10"></script>
  <script src="../../assets/js/ui/filters.js?v=10"></script>
  <script src="../../assets/js/ui/layout.js?v=10"></script>
  <script src="../../assets/js/pages/page-staff-directory.js?v=10"></script>
</body>
</html>
