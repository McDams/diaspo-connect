<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Support — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=15" rel="stylesheet">
  <link href="../../assets/css/base.css?v=15" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=15" rel="stylesheet">
  <link href="../../assets/css/components.css?v=15" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=15" rel="stylesheet">
</head>
<body data-page="support-dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Bonjour <span id="welcome-name">-</span></h1>
      <p class="text-body-secondary mb-4">Support utilisateur : tickets techniques et fonctionnels.</p>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-info mb-2"><i class="bi bi-headset"></i></div><div class="dc-stat-value" id="kpi-open">-</div><div class="dc-stat-label">Tickets ouverts</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-hourglass-split"></i></div><div class="dc-stat-value" id="kpi-awaiting">-</div><div class="dc-stat-label">Réponses en attente</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-check2-circle"></i></div><div class="dc-stat-value" id="kpi-resolved">-</div><div class="dc-stat-label">Résolus</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-emoji-smile"></i></div><div class="dc-stat-value" id="kpi-satisfaction">-</div><div class="dc-stat-label">Satisfaction (simulée)</div></div>
        </div>
      </div>

      <div class="dc-card p-3">
        <h6 class="mb-3"><i class="bi bi-headset text-primary me-2"></i>Tickets support</h6>
        <div class="table-responsive">
          <table class="table dc-table mb-0 align-middle">
            <thead><tr><th>Réf.</th><th>Demandeur</th><th>Priorité</th><th>Statut</th><th>Réponse</th><th></th></tr></thead>
            <tbody id="tickets-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=15"></script>
  <script src="../../assets/js/core/utils.js?v=15"></script>
  <script src="../../assets/js/core/auth.js?v=15"></script>
  <script src="../../assets/js/core/permissions.js?v=15"></script>
  <script src="../../assets/js/core/staff-guard.js?v=15"></script>
  <script src="../../assets/js/core/notification-center.js?v=15"></script>
  <script src="../../assets/js/ui/layout.js?v=15"></script>
  <script src="../../assets/js/pages/page-support-dashboard.js?v=15"></script>
</body>
</html>
