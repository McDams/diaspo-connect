<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord admin — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=3" rel="stylesheet">
  <link href="../../assets/css/base.css?v=3" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
  <link href="../../assets/css/components.css?v=3" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=3" rel="stylesheet">
</head>
<body data-page="dashboard">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-4">Supervision de la plateforme</h1>

      <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-navy mb-2"><i class="bi bi-people"></i></div><div class="dc-stat-value" id="kpi-users">-</div><div class="dc-stat-label">Utilisateurs</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-terracotta mb-2"><i class="bi bi-mortarboard"></i></div><div class="dc-stat-value" id="kpi-mentees">-</div><div class="dc-stat-label">Filleuls</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-teal mb-2"><i class="bi bi-person-hearts"></i></div><div class="dc-stat-value" id="kpi-mentors">-</div><div class="dc-stat-label">Parrains / marraines</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-navy mb-2"><i class="bi bi-diagram-3"></i></div><div class="dc-stat-value" id="kpi-active-matchings">-</div><div class="dc-stat-label">Matchings actifs</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-house-check"></i></div><div class="dc-stat-value" id="kpi-housing-pending">-</div><div class="dc-stat-label">Annonces à modérer</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-danger mb-2"><i class="bi bi-flag"></i></div><div class="dc-stat-value" id="kpi-reports-open">-</div><div class="dc-stat-label">Signalements ouverts</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-danger mb-2"><i class="bi bi-chat-square-text"></i></div><div class="dc-stat-value" id="kpi-flagged-messages">-</div><div class="dc-stat-label">Messages signalés</div></div>
        </div>
        <div class="col-6 col-md-3">
          <div class="dc-stat-card"><div class="dc-stat-icon dc-icon-warning mb-2"><i class="bi bi-briefcase"></i></div><div class="dc-stat-value" id="kpi-opp-pending">-</div><div class="dc-stat-label">Offres en attente</div></div>
        </div>
      </div>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="dc-card p-3 h-100">
            <h6 class="mb-3"><i class="bi bi-exclamation-triangle text-warning me-2"></i>Alertes quota de parrainage</h6>
            <div id="quota-alerts"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="dc-card p-3 h-100">
            <h6 class="mb-3"><i class="bi bi-flag text-danger me-2"></i>Signalements récents</h6>
            <div id="recent-reports"></div>
            <a href="moderation-messages.html" class="small d-block mt-2">Voir tous les signalements <i class="bi bi-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=3"></script>
  <script src="../../assets/js/core/utils.js?v=3"></script>
  <script src="../../assets/js/core/auth.js?v=3"></script>
  <script src="../../assets/js/core/notification-center.js?v=3"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=3"></script>
  <script src="../../assets/js/ui/layout.js?v=3"></script>
  <script src="../../assets/js/pages/page-admin-dashboard.js?v=3"></script>
</body>
</html>
