<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchings — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=10" rel="stylesheet">
  <link href="../../assets/css/base.css?v=10" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=10" rel="stylesheet">
  <link href="../../assets/css/components.css?v=10" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=10" rel="stylesheet">
</head>
<body data-page="matching">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="h4 mb-0">Supervision des matchings</h1>
        <button class="btn btn-primary btn-sm" id="new-matching-btn"><i class="bi bi-plus-lg me-1"></i>Matching manuel</button>
      </div>
      <div class="row g-4">
        <div class="col-lg-8">
          <form id="filters-form" class="dc-filter-panel mb-3">
            <label for="f-status" class="form-label">Filtrer par statut</label>
            <select id="f-status" class="form-select">
              <option value="all">Tous statuts</option>
              <option value="en_attente">En attente</option>
              <option value="validee">Validée</option>
              <option value="active">Active</option>
              <option value="suspendue">Suspendue</option>
              <option value="terminee">Terminée</option>
            </select>
          </form>
          <span id="results-count" class="small text-muted-dc d-block mb-2"></span>
          <div class="dc-card p-0">
            <div class="table-responsive">
              <table class="table dc-table mb-0 align-middle">
                <thead><tr><th>Mentoré</th><th>Mentor</th><th>Score</th><th>Statut</th><th>Demandée le</th><th class="text-end">Actions</th></tr></thead>
                <tbody id="matchings-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-bar-chart-steps text-primary me-2"></i>Charge des mentors</h6>
            <div id="mentor-load"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Détail / historique d'un binôme -->
  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="detailModalLabel">Binôme</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="detailModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Suspension / fin d'accompagnement (avec motif) -->
  <div class="modal fade" id="reasonModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="reasonModalLabel">Action</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="reason-form" novalidate>
            <input type="hidden" id="reason-matching-id">
            <input type="hidden" id="reason-target-status">
            <div class="mb-3">
              <label for="reason-text" class="form-label dc-required">Motif</label>
              <textarea class="form-control" id="reason-text" name="reason" rows="3" required></textarea>
              <div class="invalid-feedback">Un motif est requis pour tracer cette décision.</div>
            </div>
            <button type="submit" class="btn btn-danger w-100" id="reason-submit-btn">Confirmer</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Création / réassignation manuelle -->
  <div class="modal fade" id="manualModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="manualModalLabel">Nouveau matching manuel</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <form id="manual-form" novalidate>
            <input type="hidden" id="manual-reassign-of">
            <div class="mb-3">
              <label for="manual-mentee" class="form-label dc-required">Mentoré</label>
              <select class="form-select" id="manual-mentee" required></select>
            </div>
            <div class="mb-3">
              <label for="manual-mentor" class="form-label dc-required">Mentor</label>
              <select class="form-select" id="manual-mentor" required></select>
              <div class="form-text" id="manual-score-hint"></div>
            </div>
            <div class="dc-banner dc-banner-info mb-3" id="manual-reassign-banner" style="display:none;">
              <i class="bi bi-info-circle"></i>
              <span>Le binôme actuel sera automatiquement marqué "terminé" (motif : réassignation) au profit de ce nouveau binôme.</span>
            </div>
            <button type="submit" class="btn btn-primary w-100">Créer le matching</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=10"></script>
  <script src="../../assets/js/core/utils.js?v=10"></script>
  <script src="../../assets/js/core/auth.js?v=10"></script>
  <script src="../../assets/js/core/notification-center.js?v=10"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=10"></script>
  <script src="../../assets/js/ui/filters.js?v=10"></script>
  <script src="../../assets/js/ui/modals.js?v=10"></script>
  <script src="../../assets/js/ui/forms.js?v=10"></script>
  <script src="../../assets/js/ui/layout.js?v=10"></script>
  <script src="../../assets/js/pages/page-admin-matching.js?v=10"></script>
</body>
</html>
