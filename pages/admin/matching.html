<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchings — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=3" rel="stylesheet">
  <link href="../../assets/css/base.css?v=3" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
  <link href="../../assets/css/components.css?v=3" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=3" rel="stylesheet">
</head>
<body data-page="matching">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-4">Supervision des matchings</h1>
      <div class="row g-4">
        <div class="col-lg-8">
          <form id="filters-form" class="dc-filter-panel mb-3">
            <label for="f-status" class="form-label">Filtrer par statut</label>
            <select id="f-status" class="form-select">
              <option value="all">Tous statuts</option>
              <option value="en_attente">En attente</option>
              <option value="validee">Validée</option>
              <option value="active">Active</option>
              <option value="suspendue">Suspendue</option>
              <option value="terminee">Terminée</option>
            </select>
          </form>
          <span id="results-count" class="small text-muted-dc d-block mb-2"></span>
          <div class="dc-card p-0">
            <div class="table-responsive">
              <table class="table dc-table mb-0 align-middle">
                <thead><tr><th>Filleul</th><th>Parrain/Marraine</th><th>Score</th><th>Statut</th><th>Demandée le</th></tr></thead>
                <tbody id="matchings-tbody"></tbody>
              </table>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-bar-chart-steps text-primary me-2"></i>Charge des parrains</h6>
            <div id="mentor-load"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=3"></script>
  <script src="../../assets/js/core/utils.js?v=3"></script>
  <script src="../../assets/js/core/auth.js?v=3"></script>
  <script src="../../assets/js/core/notification-center.js?v=3"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=3"></script>
  <script src="../../assets/js/ui/filters.js?v=3"></script>
  <script src="../../assets/js/ui/layout.js?v=3"></script>
  <script src="../../assets/js/pages/page-admin-matching.js?v=3"></script>
</body>
</html>
