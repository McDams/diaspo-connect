<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signalements — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=3" rel="stylesheet">
  <link href="../../assets/css/base.css?v=3" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
  <link href="../../assets/css/components.css?v=3" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=3" rel="stylesheet">
</head>
<body data-page="moderation-messages">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Signalements &amp; messages modérés</h1>
      <p class="text-body-secondary mb-4">Harcèlement, faux profil, tentative d'arnaque, proposition déplacée, comportement inapproprié.</p>

      <form id="filters-form" class="dc-filter-panel mb-3">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="f-status" class="form-label">Statut</label>
            <select id="f-status" class="form-select">
              <option value="all">Tous statuts</option>
              <option value="ouvert">Ouvert</option>
              <option value="en_cours">En cours</option>
              <option value="resolu">Résolu</option>
              <option value="rejete">Rejeté</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="f-reason" class="form-label">Motif</label>
            <select id="f-reason" class="form-select">
              <option value="all">Tous motifs</option>
              <option value="harcelement">Harcèlement</option>
              <option value="comportement_inapproprie">Comportement inapproprié</option>
              <option value="faux_profil">Faux profil</option>
              <option value="tentative_arnaque">Tentative d'arnaque</option>
              <option value="proposition_deplacee">Proposition déplacée</option>
              <option value="autre">Autre</option>
            </select>
          </div>
        </div>
      </form>

      <span id="results-count" class="small text-muted-dc d-block mb-2"></span>
      <div id="reports-list"><div class="text-center py-5"><div class="spinner-border text-primary"></div></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=3"></script>
  <script src="../../assets/js/core/utils.js?v=3"></script>
  <script src="../../assets/js/core/auth.js?v=3"></script>
  <script src="../../assets/js/core/notification-center.js?v=3"></script>
  <script src="../../assets/js/ui/filters.js?v=3"></script>
  <script src="../../assets/js/ui/layout.js?v=3"></script>
  <script src="../../assets/js/pages/page-admin-moderation-messages.js?v=3"></script>
</body>
</html>
