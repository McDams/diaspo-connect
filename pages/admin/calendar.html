<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier global — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=17" rel="stylesheet">
  <link href="../../assets/css/base.css?v=17" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=17" rel="stylesheet">
  <link href="../../assets/css/components.css?v=17" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=17" rel="stylesheet">
</head>
<body data-page="calendar">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Calendrier global</h1>
      <p class="text-body-secondary small mb-4">Échéances des cartes Kanban et des tickets, tous pôles confondus.</p>

      <div class="row g-4">
        <div class="col-lg-8">
          <div class="dc-card p-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h6 class="mb-0" id="month-label"><i class="bi bi-calendar3 me-2 text-primary"></i>-</h6>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" id="prev-month-btn"><i class="bi bi-chevron-left"></i></button>
                <button class="btn btn-outline-secondary" id="next-month-btn"><i class="bi bi-chevron-right"></i></button>
              </div>
            </div>
            <div class="dc-calendar-grid" id="calendar-grid"></div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="dc-card p-3 mb-4">
            <h6 class="mb-3 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>En retard</h6>
            <div id="overdue-list"></div>
          </div>
          <div class="dc-card p-3">
            <h6 class="mb-3" id="day-panel-title"><i class="bi bi-calendar-event me-2 text-primary"></i>Sélectionnez un jour</h6>
            <div id="day-panel"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=17"></script>
  <script src="../../assets/js/core/audit.js?v=17"></script>
  <script src="../../assets/js/core/utils.js?v=17"></script>
  <script src="../../assets/js/core/auth.js?v=17"></script>
  <script src="../../assets/js/core/notification-center.js?v=17"></script>
  <script src="../../assets/js/engine/kanban-engine.js?v=17"></script>
  <script src="../../assets/js/ui/layout.js?v=17"></script>
  <script src="../../assets/js/pages/page-admin-calendar.js?v=17"></script>
</body>
</html>
