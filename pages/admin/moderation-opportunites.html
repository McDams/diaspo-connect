<html lang="fr">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<body data-page="moderation-opportunites">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Modération des offres</h1>
      <p class="text-body-secondary mb-4">Jobs saisonniers, stages et alternances à valider avant publication.</p>

      <form id="filters-form" class="dc-filter-panel mb-3">
        <label for="f-status" class="form-label">Statut</label>
        <select id="f-status" class="form-select">
          <option value="all">Tous statuts</option>
          <option value="soumise" selected>En attente de modération</option>
          <option value="validee">Validées</option>
          <option value="rejetee">Rejetées</option>
        </select>
      </form>

      <span id="results-count" class="small text-muted-dc d-block mb-2"></span>
      <div id="opp-list"><div class="text-center py-5"><div class="spinner-border text-primary"></div></div></div>
    </div>
  </div>
