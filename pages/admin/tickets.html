<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=22" rel="stylesheet">
  <link href="../../assets/css/base.css?v=22" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=22" rel="stylesheet">
  <link href="../../assets/css/components.css?v=22" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=22" rel="stylesheet">
</head>
<body data-page="tickets">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Centre de tickets</h1>
      <p class="text-body-secondary small mb-4">Vue transverse de toutes les demandes entrantes, tous services confondus. L'administration peut assigner, réassigner et escalader n'importe quel ticket.</p>

      <form id="filters-form" class="dc-filter-panel mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-3"><label class="form-label small">Recherche</label><input type="search" class="form-control form-control-sm" id="f-q" placeholder="Numéro, demandeur…"></div>
          <div class="col-md-2"><label class="form-label small">Statut</label>
            <select class="form-select form-select-sm" id="f-status"><option value="all">Tous</option><option value="nouveau">Nouveau</option><option value="en_cours">En cours</option><option value="en_attente_reponse">En attente réponse</option><option value="resolu">Résolu</option><option value="ferme">Fermé</option></select>
          </div>
          <div class="col-md-2"><label class="form-label small">Priorité</label>
            <select class="form-select form-select-sm" id="f-priority"><option value="all">Toutes</option><option value="urgente">Urgente</option><option value="haute">Haute</option><option value="normale">Normale</option><option value="basse">Basse</option></select>
          </div>
          <div class="col-md-3"><label class="form-label small">Service cible</label>
            <select class="form-select form-select-sm" id="f-service"><option value="all">Tous</option></select>
          </div>
          <div class="col-md-2"><label class="form-label small">Assignation</label>
            <select class="form-select form-select-sm" id="f-unassigned"><option value="all">Tous</option><option value="unassigned">Non assignés</option></select>
          </div>
        </div>
      </form>

      <p class="small text-muted-dc mb-2" id="results-count">-</p>
      <div class="dc-card p-0">
        <div class="table-responsive">
          <table class="table dc-table mb-0 align-middle">
            <thead><tr><th>Ticket</th><th>Demandeur</th><th>Service</th><th>Priorité</th><th>Assigné à</th><th>Statut</th><th>Échéance</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="tickets-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="detailModalLabel">Ticket</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body" id="detailModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=22"></script>
  <script src="../../assets/js/core/audit.js?v=22"></script>
  <script src="../../assets/js/core/utils.js?v=22"></script>
  <script src="../../assets/js/core/auth.js?v=22"></script>
  <script src="../../assets/js/core/notification-center.js?v=22"></script>
  <script src="../../assets/js/ui/filters.js?v=22"></script>
  <script src="../../assets/js/ui/modals.js?v=22"></script>
  <script src="../../assets/js/ui/layout.js?v=22"></script>
  <script src="../../assets/js/pages/page-admin-tickets.js?v=22"></script>
</body>
</html>
