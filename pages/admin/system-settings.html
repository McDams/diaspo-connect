<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres système — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=20" rel="stylesheet">
  <link href="../../assets/css/base.css?v=20" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=20" rel="stylesheet">
  <link href="../../assets/css/components.css?v=20" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=20" rel="stylesheet">
</head>
<body data-page="system-settings">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Paramètres système</h1>
      <p class="text-body-secondary small mb-4">Réglages globaux de la plateforme et bascules de fonctionnalités (feature flags).</p>

      <div class="row g-4">
        <div class="col-lg-6">
          <div class="dc-form-section mb-4">
            <h6 class="mb-3"><i class="bi bi-sliders text-primary me-2"></i>Réglages généraux</h6>
            <form id="general-form" novalidate>
              <div class="mb-3"><label class="form-label small dc-required">Nom de la plateforme</label><input type="text" class="form-control form-control-sm" id="s-name" name="platformName"><div class="invalid-feedback"></div></div>
              <div class="mb-3"><label class="form-label small dc-required">Email support</label><input type="email" class="form-control form-control-sm" id="s-email" name="supportEmail"><div class="invalid-feedback"></div></div>
              <div class="mb-3"><label class="form-label small dc-required">Mentorés actifs max. par mentor</label><input type="number" class="form-control form-control-sm" id="s-quota" name="maxMentees" min="1"><div class="invalid-feedback"></div></div>
              <div class="mb-3"><label class="form-label small dc-required">Délai de traitement par défaut (heures)</label><input type="number" class="form-control form-control-sm" id="s-sla" name="slaHours" min="1"><div class="invalid-feedback"></div></div>
              <div class="form-check form-switch mb-3"><input class="form-check-input" type="checkbox" id="s-maintenance"><label class="form-check-label small" for="s-maintenance">Mode maintenance</label></div>
              <button type="submit" class="btn btn-primary btn-sm">Enregistrer</button>
            </form>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="dc-form-section">
            <h6 class="mb-3"><i class="bi bi-toggles text-primary me-2"></i>Feature flags</h6>
            <div id="flags-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=20"></script>
  <script src="../../assets/js/core/audit.js?v=20"></script>
  <script src="../../assets/js/core/utils.js?v=20"></script>
  <script src="../../assets/js/core/auth.js?v=20"></script>
  <script src="../../assets/js/core/notification-center.js?v=20"></script>
  <script src="../../assets/js/ui/forms.js?v=20"></script>
  <script src="../../assets/js/ui/layout.js?v=20"></script>
  <script src="../../assets/js/pages/page-admin-system-settings.js?v=20"></script>
</body>
</html>
