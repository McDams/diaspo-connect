<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charge de travail — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=16" rel="stylesheet">
  <link href="../../assets/css/base.css?v=16" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=16" rel="stylesheet">
  <link href="../../assets/css/components.css?v=16" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=16" rel="stylesheet">
</head>
<body data-page="workload">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Charge de travail &amp; performance par pôle</h1>
      <p class="text-body-secondary small mb-4">Cartes actives par pôle et taux de charge déclaré par chaque collaborateur.</p>

      <div class="row g-4 mb-4" id="pole-cards"></div>

      <div class="dc-card p-3 mb-4">
        <h6 class="mb-3"><i class="bi bi-graph-up-arrow text-primary me-2"></i>Performance par pôle</h6>
        <div class="table-responsive">
          <table class="table dc-table mb-0 align-middle">
            <thead><tr><th>Pôle</th><th>Cartes terminées</th><th>Taux de complétion</th><th>Tickets résolus</th><th>Délai moyen de résolution</th></tr></thead>
            <tbody id="performance-tbody"></tbody>
          </table>
        </div>
      </div>

      <div class="dc-card p-3">
        <h6 class="mb-3"><i class="bi bi-person-lines-fill text-primary me-2"></i>Charge individuelle</h6>
        <div class="table-responsive">
          <table class="table dc-table mb-0 align-middle">
            <thead><tr><th>Collaborateur</th><th>Pôle</th><th>Cartes actives</th><th>En retard</th><th>Charge déclarée</th></tr></thead>
            <tbody id="staff-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=16"></script>
  <script src="../../assets/js/core/audit.js?v=16"></script>
  <script src="../../assets/js/core/utils.js?v=16"></script>
  <script src="../../assets/js/core/auth.js?v=16"></script>
  <script src="../../assets/js/core/notification-center.js?v=16"></script>
  <script src="../../assets/js/engine/kanban-engine.js?v=16"></script>
  <script src="../../assets/js/ui/layout.js?v=16"></script>
  <script src="../../assets/js/pages/page-admin-workload.js?v=16"></script>
</body>
</html>
