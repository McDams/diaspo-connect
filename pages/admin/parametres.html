<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paramètres — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=22" rel="stylesheet">
  <link href="../../assets/css/base.css?v=22" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=22" rel="stylesheet">
  <link href="../../assets/css/components.css?v=22" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=22" rel="stylesheet">
</head>
<body data-page="parametres" data-role="admin">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-4">Paramètres administrateur</h1>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="dc-card p-3">
            <h6 class="mb-3"><i class="bi bi-person-badge text-primary me-2"></i>Mon compte</h6>
            <p class="mb-1 fw-semibold" id="account-name">-</p>
            <p class="small text-muted-dc mb-2" id="account-email">-</p>
            <p class="small text-muted-dc mb-2">Membre depuis le <span id="account-created">-</span></p>
            <div id="account-verified"></div>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="dc-form-section mb-4">
            <h6 class="mb-3"><i class="bi bi-shield-lock text-primary me-2"></i>Changer mon mot de passe</h6>
            <form id="password-form" novalidate>
              <div class="row g-3">
                <div class="col-md-12"><label for="currentPassword" class="form-label dc-required">Mot de passe actuel</label><input type="password" class="form-control" id="currentPassword" name="currentPassword" required><div class="invalid-feedback"></div></div>
                <div class="col-md-6"><label for="newPassword" class="form-label dc-required">Nouveau mot de passe</label><input type="password" class="form-control" id="newPassword" name="newPassword" minlength="6" required><div class="invalid-feedback"></div></div>
                <div class="col-md-6"><label for="confirmPassword" class="form-label dc-required">Confirmer</label><input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required><div class="invalid-feedback"></div></div>
                <div class="col-12"><button type="submit" class="btn btn-primary">Mettre à jour le mot de passe</button></div>
              </div>
            </form>
          </div>
          <div class="dc-form-section">
            <h6 class="mb-3"><i class="bi bi-bell text-primary me-2"></i>Préférences de notifications</h6>
            <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="notif-1" checked><label class="form-check-label" for="notif-1">Nouveaux signalements</label></div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="notif-2" checked><label class="form-check-label" for="notif-2">Annonces et offres à modérer</label></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=22"></script>
  <script src="../../assets/js/core/audit.js?v=22"></script>
  <script src="../../assets/js/core/utils.js?v=22"></script>
  <script src="../../assets/js/core/auth.js?v=22"></script>
  <script src="../../assets/js/core/notification-center.js?v=22"></script>
  <script src="../../assets/js/ui/forms.js?v=22"></script>
  <script src="../../assets/js/ui/modals.js?v=22"></script>
  <script src="../../assets/js/ui/layout.js?v=22"></script>
  <script src="../../assets/js/pages/page-parametres.js?v=22"></script>
</body>
</html>
