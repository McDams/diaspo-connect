<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal d'audit — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=10" rel="stylesheet">
  <link href="../../assets/css/base.css?v=10" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=10" rel="stylesheet">
  <link href="../../assets/css/components.css?v=10" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=10" rel="stylesheet">
</head>
<body data-page="audit">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h1 class="h4 mb-0">Journal d'audit</h1>
        <button class="btn btn-outline-secondary btn-sm" id="export-btn"><i class="bi bi-download me-1"></i>Exporter (simulation)</button>
      </div>
      <p class="text-body-secondary small mb-4">Toute action sensible (suspension, validation, réassignation, création de compte) est tracée ici — journal en lecture seule.</p>

      <form id="filters-form" class="dc-filter-panel mb-3">
        <div class="row g-2 align-items-end">
          <div class="col-md-4"><label class="form-label small">Recherche</label><input type="search" class="form-control form-control-sm" id="f-q" placeholder="Acteur, détail, cible…"></div>
          <div class="col-md-4"><label class="form-label small">Type d'action</label><select class="form-select form-select-sm" id="f-action"><option value="all">Toutes</option></select></div>
          <div class="col-md-4"><label class="form-label small">Type de cible</label><select class="form-select form-select-sm" id="f-target"><option value="all">Toutes</option></select></div>
        </div>
      </form>

      <p class="small text-muted-dc mb-2" id="results-count">-</p>
      <ol class="dc-timeline" id="audit-list"></ol>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=10"></script>
  <script src="../../assets/js/core/utils.js?v=10"></script>
  <script src="../../assets/js/core/auth.js?v=10"></script>
  <script src="../../assets/js/core/notification-center.js?v=10"></script>
  <script src="../../assets/js/ui/filters.js?v=10"></script>
  <script src="../../assets/js/ui/layout.js?v=10"></script>
  <script src="../../assets/js/pages/page-admin-audit.js?v=10"></script>
</body>
</html>
