  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body data-page="reports">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <h1 class="h4 mb-0">Rapports &amp; délais de traitement</h1>

      <div class="row g-4">

          <div class="dc-card p-3">

            <div id="tickets-breakdown"></div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="dc-card p-3">
            <h6 class="mb-3">Répartition des cartes Kanban par pôle</h6>
