<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=3" rel="stylesheet">
  <link href="../../assets/css/base.css?v=3" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
  <link href="../../assets/css/components.css?v=3" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=3" rel="stylesheet">
</head>
<body data-page="utilisateurs">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-4">Gestion des utilisateurs</h1>

      <form id="filters-form" class="dc-filter-panel mb-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="f-recherche" class="form-label">Recherche</label>
            <input type="search" id="f-recherche" class="form-control" placeholder="Nom ou email...">
          </div>
          <div class="col-md-3">
            <label for="f-role" class="form-label">Rôle</label>
            <select id="f-role" class="form-select">
              <option value="all">Tous les rôles</option>
              <option value="filleul">Filleul</option>
              <option value="parrain">Parrain / Marraine</option>
              <option value="proprietaire">Propriétaire</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="f-status" class="form-label">Statut</label>
            <select id="f-status" class="form-select">
              <option value="all">Tous statuts</option>
              <option value="actif">Actif</option>
              <option value="suspendu">Suspendu</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="f-verified" class="form-label">Vérification</label>
            <select id="f-verified" class="form-select">
              <option value="all">Tous</option>
              <option value="true">Vérifiés</option>
              <option value="false">Non vérifiés</option>
            </select>
          </div>
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <span id="results-count" class="small text-muted-dc">Chargement…</span>
      </div>
      <div class="dc-card p-0">
        <div class="table-responsive">
          <table class="table dc-table mb-0 align-middle">
            <thead><tr><th>Utilisateur</th><th>Rôle</th><th>Ville</th><th>Vérification</th><th>Statut</th><th></th></tr></thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="detailModalLabel">Utilisateur</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
        <div class="modal-body" id="detailModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=3"></script>
  <script src="../../assets/js/core/utils.js?v=3"></script>
  <script src="../../assets/js/core/auth.js?v=3"></script>
  <script src="../../assets/js/core/notification-center.js?v=3"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=3"></script>
  <script src="../../assets/js/ui/filters.js?v=3"></script>
  <script src="../../assets/js/ui/modals.js?v=3"></script>
  <script src="../../assets/js/ui/layout.js?v=3"></script>
  <script src="../../assets/js/pages/page-admin-utilisateurs.js?v=3"></script>
</body>
</html>
