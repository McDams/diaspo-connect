<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utilisateurs — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=22" rel="stylesheet">
  <link href="../../assets/css/base.css?v=22" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=22" rel="stylesheet">
  <link href="../../assets/css/components.css?v=22" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=22" rel="stylesheet">
</head>
<body data-page="utilisateurs">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="h4 mb-0">Gestion des utilisateurs</h1>
        <button class="btn btn-primary btn-sm" id="new-user-btn"><i class="bi bi-person-plus me-1"></i>Nouvel utilisateur</button>
      </div>

      <form id="filters-form" class="dc-filter-panel mb-3">
        <div class="row g-3 align-items-end">
          <div class="col-md-4">
            <label for="f-recherche" class="form-label">Recherche</label>
            <input type="search" id="f-recherche" class="form-control" placeholder="Nom ou email...">
          </div>
          <div class="col-md-3">
            <label for="f-role" class="form-label">Rôle</label>
            <select id="f-role" class="form-select">
              <option value="all">Tous les rôles</option>
              <option value="mentore">Mentoré</option>
              <option value="mentor">Mentor</option>
              <option value="proprietaire">Propriétaire</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="f-status" class="form-label">Statut</label>
            <select id="f-status" class="form-select">
              <option value="all">Tous statuts</option>
              <option value="actif">Actif</option>
              <option value="suspendu">Suspendu</option>
            </select>
          </div>
          <div class="col-md-2">
            <label for="f-verified" class="form-label">Vérification</label>
            <select id="f-verified" class="form-select">
              <option value="all">Tous</option>
              <option value="true">Vérifiés</option>
              <option value="false">Non vérifiés</option>
            </select>
          </div>
        </div>
        <div class="form-check mt-2">
          <input class="form-check-input" type="checkbox" id="f-recent">
          <label class="form-check-label small" for="f-recent">Nouveaux inscrits uniquement (30 derniers jours)</label>
        </div>
      </form>

      <div class="d-flex justify-content-between align-items-center mb-2">
        <span id="results-count" class="small text-muted-dc">Chargement…</span>
      </div>
      <div class="dc-card p-0">
        <div class="table-responsive">
          <table class="table dc-table mb-0 align-middle">
            <thead><tr><th>Utilisateur</th><th>Rôle</th><th>Ville</th><th>Vérification</th><th>Statut</th><th></th></tr></thead>
            <tbody id="users-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="detailModalLabel">Utilisateur</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button></div>
        <div class="modal-body" id="detailModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Création / édition complète d'un utilisateur -->
  <div class="modal fade" id="userFormModal" tabindex="-1" aria-labelledby="userFormModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="user-form" novalidate>
          <div class="modal-header">
            <h5 class="modal-title" id="userFormModalLabel">Utilisateur</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="uf-id">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="uf-firstname" class="form-label dc-required">Prénom</label>
                <input type="text" class="form-control" id="uf-firstname" name="firstName" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="uf-lastname" class="form-label dc-required">Nom</label>
                <input type="text" class="form-control" id="uf-lastname" name="lastName" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="uf-email" class="form-label dc-required">Email</label>
                <input type="email" class="form-control" id="uf-email" name="email" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="uf-phone" class="form-label">Téléphone</label>
                <input type="text" class="form-control" id="uf-phone" name="phone">
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="uf-city" class="form-label">Ville</label>
                <input type="text" class="form-control" id="uf-city" name="city">
              </div>
              <div class="col-md-6">
                <label for="uf-role" class="form-label dc-required">Rôle</label>
                <select class="form-select" id="uf-role" name="role" required>
                  <option value="mentore">Mentoré</option>
                  <option value="mentor">Mentor</option>
                  <option value="proprietaire">Propriétaire</option>
                  <option value="admin">Admin</option>
                </select>
                <div class="form-text" id="uf-role-hint"></div>
              </div>
              <div class="col-md-6" id="uf-status-field">
                <label for="uf-status" class="form-label">Statut</label>
                <select class="form-select" id="uf-status">
                  <option value="actif">Actif</option>
                  <option value="suspendu">Suspendu</option>
                </select>
              </div>
              <div class="col-12" id="uf-verified-field">
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" id="uf-verified">
                  <label class="form-check-label small" for="uf-verified">Profil vérifié</label>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=22"></script>
  <script src="../../assets/js/core/audit.js?v=22"></script>
  <script src="../../assets/js/core/utils.js?v=22"></script>
  <script src="../../assets/js/core/auth.js?v=22"></script>
  <script src="../../assets/js/core/permissions.js?v=22"></script>
  <script src="../../assets/js/core/notification-center.js?v=22"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=22"></script>
  <script src="../../assets/js/ui/filters.js?v=22"></script>
  <script src="../../assets/js/ui/modals.js?v=22"></script>
  <script src="../../assets/js/ui/forms.js?v=22"></script>
  <script src="../../assets/js/ui/layout.js?v=22"></script>
  <script src="../../assets/js/pages/page-admin-utilisateurs.js?v=22"></script>
</body>
</html>
