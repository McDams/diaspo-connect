<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ressources &amp; FAQ — Administration DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=3" rel="stylesheet">
  <link href="../../assets/css/base.css?v=3" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
  <link href="../../assets/css/components.css?v=3" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=3" rel="stylesheet">
</head>
<body data-page="ressources">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="h4 mb-0">Ressources &amp; FAQ</h1>
        <button class="btn btn-primary btn-sm" id="new-resource-btn"><i class="bi bi-plus-circle me-1"></i>Nouvelle ressource</button>
      </div>

      <div class="dc-card p-0">
        <div class="table-responsive">
          <table class="table dc-table mb-0 align-middle">
            <thead><tr><th>Titre</th><th>Catégorie</th><th>Mise à jour</th><th></th></tr></thead>
            <tbody id="resources-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="resourceModal" tabindex="-1" aria-labelledby="resourceModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <form id="resource-form">
          <div class="modal-header">
            <h5 class="modal-title" id="resourceModalLabel">Ressource</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="resource-id">
            <div class="mb-3">
              <label for="modal-type" class="form-label">Type</label>
              <select class="form-select" id="modal-type">
                <option value="guide">Guide pratique</option>
                <option value="faq">Question FAQ</option>
              </select>
            </div>
            <div id="guide-fields">
              <div class="mb-3">
                <label for="modal-category" class="form-label">Catégorie</label>
                <select class="form-select" id="modal-category">
                  <option value="demarches_administratives">Démarches administratives</option>
                  <option value="logement">Logement</option>
                  <option value="banque">Banque</option>
                  <option value="assurance">Assurance</option>
                  <option value="transport">Transport</option>
                  <option value="sante">Santé</option>
                  <option value="checklist_arrivee">Checklist d'arrivée</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="modal-title" class="form-label">Titre</label>
                <input type="text" class="form-control" id="modal-title">
              </div>
              <div class="mb-3">
                <label for="modal-content" class="form-label">Contenu</label>
                <textarea class="form-control" id="modal-content" rows="4"></textarea>
              </div>
            </div>
            <div id="faq-fields" class="d-none">
              <div class="mb-3">
                <label for="modal-question" class="form-label">Question</label>
                <input type="text" class="form-control" id="modal-question">
              </div>
              <div class="mb-3">
                <label for="modal-answer" class="form-label">Réponse</label>
                <textarea class="form-control" id="modal-answer" rows="4"></textarea>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
            <button type="submit" class="btn btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=3"></script>
  <script src="../../assets/js/core/utils.js?v=3"></script>
  <script src="../../assets/js/core/auth.js?v=3"></script>
  <script src="../../assets/js/core/notification-center.js?v=3"></script>
  <script src="../../assets/js/ui/modals.js?v=3"></script>
  <script src="../../assets/js/ui/layout.js?v=3"></script>
  <script src="../../assets/js/pages/page-admin-ressources.js?v=3"></script>
</body>
</html>
