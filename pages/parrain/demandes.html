<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demandes reçues — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=3" rel="stylesheet">
  <link href="../../assets/css/base.css?v=3" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=3" rel="stylesheet">
  <link href="../../assets/css/components.css?v=3" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=3" rel="stylesheet">
</head>
<body data-page="demandes">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <h1 class="h4 mb-0">Demandes reçues</h1>
        <span id="pending-count" class="small text-muted-dc"></span>
      </div>
      <div id="requests-list"><div class="text-center py-5"><div class="spinner-border text-primary"></div></div></div>
    </div>
  </div>

  <div class="modal fade" id="refuseModal" tabindex="-1" aria-labelledby="refuseModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="refuseModalLabel">Refuser la demande</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body">
          <label for="refuse-reason" class="form-label">Motif du refus (optionnel, transmis à l'administration)</label>
          <select class="form-select" id="refuse-reason">
            <option value="">Ne pas préciser</option>
            <option value="Disponibilité insuffisante actuellement">Disponibilité insuffisante actuellement</option>
            <option value="Profil peu compatible avec mes centres d'aide">Profil peu compatible avec mes centres d'aide</option>
            <option value="Ville ou établissement trop éloignés">Ville ou établissement trop éloignés</option>
            <option value="Autre engagement en cours">Autre engagement en cours</option>
          </select>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Annuler</button>
          <button type="button" class="btn btn-danger" id="confirm-refuse-btn">Confirmer le refus</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=3"></script>
  <script src="../../assets/js/core/utils.js?v=3"></script>
  <script src="../../assets/js/core/auth.js?v=3"></script>
  <script src="../../assets/js/core/notification-center.js?v=3"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=3"></script>
  <script src="../../assets/js/ui/layout.js?v=3"></script>
  <script src="../../assets/js/pages/page-parrain-demandes.js?v=3"></script>
</body>
</html>
