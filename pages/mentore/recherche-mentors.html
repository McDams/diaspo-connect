<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trouver un mentor — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=20" rel="stylesheet">
  <link href="../../assets/css/base.css?v=20" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=20" rel="stylesheet">
  <link href="../../assets/css/components.css?v=20" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=20" rel="stylesheet">
</head>
<body data-page="recherche-mentors">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-app-header"></div>
  <div class="dc-shell">
    <div id="dc-app-sidebar"></div>
    <div class="dc-content">
      <h1 class="h4 mb-1">Trouver un mentor</h1>
      <p class="text-body-secondary mb-3">Classement selon votre profil : ville, domaine, langues, disponibilité et type d'accompagnement.</p>

      <div class="dc-banner dc-banner-info mb-3 d-none" id="sex-pref-banner">
        <i class="bi bi-info-circle"></i><span id="sex-pref-banner-text"></span>
      </div>

      <div class="row g-4">
        <div class="col-lg-3">
          <form id="filters-form" class="dc-filter-panel">
            <h6 class="mb-3"><i class="bi bi-funnel me-1"></i>Filtres</h6>
            <div class="mb-3">
              <label for="f-recherche" class="form-label">Recherche</label>
              <input type="search" id="f-recherche" class="form-control" placeholder="Nom, mot-clé...">
            </div>
            <div class="mb-3">
              <label for="f-ville" class="form-label">Ville</label>
              <select id="f-ville" class="form-select"><option value="all">Toutes les villes</option></select>
            </div>
          </form>
        </div>
        <div class="col-lg-9">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span id="results-count" class="small text-muted-dc">Chargement…</span>
          </div>
          <div class="row g-3" id="mentors-grid">
            <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=20"></script>
  <script src="../../assets/js/core/audit.js?v=20"></script>
  <script src="../../assets/js/core/utils.js?v=20"></script>
  <script src="../../assets/js/core/auth.js?v=20"></script>
  <script src="../../assets/js/core/notification-center.js?v=20"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=20"></script>
  <script src="../../assets/js/ui/filters.js?v=20"></script>
  <script src="../../assets/js/ui/layout.js?v=20"></script>
  <script src="../../assets/js/pages/page-mentore-recherche-mentors.js?v=20"></script>
</body>
</html>
