<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trouver un mentor — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=22" rel="stylesheet">
  <link href="../../assets/css/base.css?v=22" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=22" rel="stylesheet">
  <link href="../../assets/css/components.css?v=22" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=22" rel="stylesheet">
</head>
<body data-page="mentors">
  <script>window.DC_ROOT = "../../";</script>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div id="dc-public-navbar"></div>

  <main id="main-content">
    <section class="bg-white border-bottom py-4">
      <div class="container">
        <h1 class="h3 mb-1">Trouver un mentor</h1>
        <p class="text-body-secondary mb-0">Des étudiants déjà installés en France, vérifiés, prêts à vous accompagner.</p>
      </div>
    </section>

    <section class="py-4">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-3">
            <form id="filters-form" class="dc-filter-panel">
              <h6 class="mb-3"><i class="bi bi-funnel me-1"></i>Filtres</h6>
              <div class="mb-3">
                <label for="f-recherche" class="form-label">Recherche</label>
                <input type="search" id="f-recherche" class="form-control" placeholder="Nom, école, mot-clé...">
              </div>
              <div class="mb-3">
                <label for="f-sexe" class="form-label">Sexe</label>
                <select id="f-sexe" class="form-select">
                  <option value="all">Indifférent</option>
                  <option value="femme">Femme</option>
                  <option value="homme">Homme</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="f-ville" class="form-label">Ville</label>
                <select id="f-ville" class="form-select"><option value="all">Toutes les villes</option></select>
              </div>
              <div class="mb-3">
                <label for="f-domaine" class="form-label">Domaine d'étude</label>
                <select id="f-domaine" class="form-select"><option value="all">Tous domaines</option></select>
              </div>
              <div class="mb-3">
                <label for="f-langue" class="form-label">Langue parlée</label>
                <select id="f-langue" class="form-select"><option value="all">Toutes langues</option></select>
              </div>
              <div class="mb-3">
                <label for="f-dispo" class="form-label">Disponibilité</label>
                <select id="f-dispo" class="form-select">
                  <option value="all">Toute disponibilité</option>
                  <option value="élevée">Élevée</option>
                  <option value="moyenne">Moyenne</option>
                  <option value="faible">Faible</option>
                </select>
              </div>
              <button type="button" id="reset-filters" class="btn btn-outline-secondary btn-sm w-100">Réinitialiser</button>
            </form>
          </div>
          <div class="col-lg-9">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <span id="results-count" class="small text-muted-dc">Chargement…</span>
            </div>
            <div class="row g-3" id="mentors-grid">
              <div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Chargement...</span></div></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailModalLabel">Profil</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
        </div>
        <div class="modal-body" id="detailModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fermer</button>
          <button type="button" class="btn btn-primary" id="detailRequestBtn">Demander un matching</button>
        </div>
      </div>
    </div>
  </div>

  <div id="dc-public-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=22"></script>
  <script src="../../assets/js/core/audit.js?v=22"></script>
  <script src="../../assets/js/core/utils.js?v=22"></script>
  <script src="../../assets/js/core/auth.js?v=22"></script>
  <script src="../../assets/js/core/permissions.js?v=22"></script>
  <script src="../../assets/js/core/notification-center.js?v=22"></script>
  <script src="../../assets/js/engine/matching-engine.js?v=22"></script>
  <script src="../../assets/js/ui/filters.js?v=22"></script>
  <script src="../../assets/js/ui/layout.js?v=22"></script>
  <script>Layout.mountPublic("mentors");</script>
  <script src="../../assets/js/pages/page-mentors.js?v=22"></script>
</body>
</html>
