<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacter l'équipe — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=17" rel="stylesheet">
  <link href="../../assets/css/base.css?v=17" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=17" rel="stylesheet">
  <link href="../../assets/css/components.css?v=17" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=17" rel="stylesheet">
</head>
<body data-page="contact-team">
  <script>window.DC_ROOT = "../../";</script>
  <a href="#main-content" class="skip-link">Aller au contenu principal</a>
  <div id="dc-public-navbar"></div>

  <main id="main-content" class="py-5">
    <div class="container">
      <div class="text-center mb-4">
        <span class="section-title-eyebrow">Nous contacter</span>
        <h1 class="h3 mt-2">Contacter l'équipe DiaspoConnect</h1>
        <p class="text-body-secondary col-lg-7 mx-auto">Choisissez le service concerné : votre demande est automatiquement routée vers la bonne personne et suivie via un numéro de ticket.</p>
      </div>

      <form id="contact-form" class="dc-form-section mx-auto" style="max-width: 900px;" novalidate>
        <h6 class="mb-3">1. Quel service souhaitez-vous contacter ?</h6>
        <div class="row g-2 mb-4" id="service-choices"></div>

        <h6 class="mb-3">2. Votre demande</h6>
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label for="name" class="form-label dc-required">Nom complet</label>
            <input type="text" class="form-control" id="name" name="name" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label dc-required">Email</label>
            <input type="email" class="form-control" id="email" name="email" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-6">
            <label for="userRole" class="form-label">Vous êtes</label>
            <select class="form-select" id="userRole" name="userRole">
              <option value="visiteur">Visiteur / futur étudiant</option>
              <option value="mentore">Mentoré</option>
              <option value="mentor">Mentor / mentor</option>
              <option value="proprietaire">Propriétaire</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="category" class="form-label">Catégorie de la demande</label>
            <select class="form-select" id="category" name="category">
              <option value="information_generale">Information générale</option>
              <option value="dossier_etudiant">Dossier étudiant</option>
              <option value="matching_mentorat">Matching / mentorat</option>
              <option value="logement">Logement</option>
              <option value="emploi">Emploi / stage / alternance</option>
              <option value="probleme_relationnel">Problème relationnel</option>
              <option value="support_technique">Support technique</option>
              <option value="signalement_securite">Signalement sécurité</option>
              <option value="partenariat">Partenariat</option>
              <option value="benevolat">Bénévolat</option>
              <option value="presse_media">Presse / média</option>
            </select>
          </div>
          <div class="col-12">
            <label for="subject" class="form-label dc-required">Sujet</label>
            <input type="text" class="form-control" id="subject" name="subject" required>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-8">
            <label for="message" class="form-label dc-required">Message</label>
            <textarea class="form-control" id="message" name="message" rows="4" required></textarea>
            <div class="invalid-feedback"></div>
          </div>
          <div class="col-md-4">
            <label for="priority" class="form-label">Priorité</label>
            <select class="form-select" id="priority" name="priority">
              <option value="basse">Basse</option>
              <option value="normale" selected>Normale</option>
              <option value="haute">Haute</option>
              <option value="urgente">Urgente</option>
            </select>
            <label for="attachment" class="form-label mt-3">Pièce jointe (optionnel)</label>
            <input type="file" class="form-control" id="attachment" name="attachment">
          </div>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="consent" name="consent" required>
          <label class="form-check-label small" for="consent">J'accepte que mes données soient utilisées pour traiter ma demande, conformément à notre <a href="privacy.html" target="_blank">politique de confidentialité</a> (RGPD).</label>
          <div class="invalid-feedback"></div>
        </div>
        <button type="submit" class="btn btn-primary">Envoyer ma demande</button>
      </form>
    </div>
  </main>

  <div id="dc-public-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=17"></script>
  <script src="../../assets/js/core/audit.js?v=17"></script>
  <script src="../../assets/js/core/utils.js?v=17"></script>
  <script src="../../assets/js/core/auth.js?v=17"></script>
  <script src="../../assets/js/core/notification-center.js?v=17"></script>
  <script src="../../assets/js/ui/forms.js?v=17"></script>
  <script src="../../assets/js/ui/layout.js?v=17"></script>
  <script>Layout.mountPublic("contact-team");</script>
  <script src="../../assets/js/pages/page-contact-team.js?v=17"></script>
</body>
</html>
