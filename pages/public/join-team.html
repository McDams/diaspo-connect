<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejoindre l'équipe — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=17" rel="stylesheet">
  <link href="../../assets/css/base.css?v=17" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=17" rel="stylesheet">
  <link href="../../assets/css/components.css?v=17" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=17" rel="stylesheet">
</head>
<body data-page="join-team">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-public-navbar"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="text-center mb-4">
            <span class="section-title-eyebrow">Rejoindre l'équipe</span>
            <h1 class="h3 mt-2">Devenir bénévole DiaspoConnect</h1>
            <p class="text-body-secondary">Quelques heures par semaine suffisent pour changer le parcours d'un étudiant. Dites-nous où vous souhaitez vous investir.</p>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-6 col-md-3"><div class="dc-card p-2 text-center small"><i class="bi bi-inboxes text-primary d-block fs-4 mb-1"></i>Secrétariat</div></div>
            <div class="col-6 col-md-3"><div class="dc-card p-2 text-center small"><i class="bi bi-people text-primary d-block fs-4 mb-1"></i>Conseil</div></div>
            <div class="col-6 col-md-3"><div class="dc-card p-2 text-center small"><i class="bi bi-headset text-primary d-block fs-4 mb-1"></i>Support</div></div>
            <div class="col-6 col-md-3"><div class="dc-card p-2 text-center small"><i class="bi bi-journal-richtext text-primary d-block fs-4 mb-1"></i>Contenu</div></div>
          </div>

          <form id="join-form" class="dc-form-section" novalidate>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="name" class="form-label dc-required">Nom complet</label>
                <input type="text" class="form-control" id="name" name="name" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label dc-required">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="city" class="form-label dc-required">Ville</label>
                <input type="text" class="form-control" id="city" name="city" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="pole" class="form-label dc-required">Pôle souhaité</label>
                <select class="form-select" id="pole" name="pole" required>
                  <option value="">Choisir…</option>
                  <option value="Secrétariat">Secrétariat</option>
                  <option value="Conseil - démarches">Conseil - démarches administratives</option>
                  <option value="Conseil - logement">Conseil - logement</option>
                  <option value="Conseil - emploi">Conseil - emploi / stage / alternance</option>
                  <option value="Modération & confiance">Modération &amp; confiance</option>
                  <option value="Support">Support utilisateur</option>
                  <option value="Partenariats">Partenariats</option>
                  <option value="Contenu & communication">Contenu &amp; communication</option>
                  <option value="Technique">Technique</option>
                </select>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="availability" class="form-label">Disponibilité estimée</label>
                <select class="form-select" id="availability" name="availability">
                  <option value="élevée">Quelques heures / semaine</option>
                  <option value="moyenne">1 à 2h / semaine</option>
                  <option value="faible">Ponctuelle</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="cv" class="form-label">CV ou profil LinkedIn (optionnel)</label>
                <input type="file" class="form-control" id="cv" name="cv">
              </div>
              <div class="col-12">
                <label for="motivation" class="form-label dc-required">Votre motivation</label>
                <textarea class="form-control" id="motivation" name="motivation" rows="4" placeholder="Pourquoi souhaitez-vous rejoindre DiaspoConnect ?" required></textarea>
                <div class="invalid-feedback"></div>
              </div>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="consent" name="consent" required>
              <label class="form-check-label small" for="consent">J'accepte que mes données soient utilisées pour traiter ma candidature, conformément à la <a href="privacy.html" target="_blank">politique de confidentialité</a>.</label>
              <div class="invalid-feedback"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Envoyer ma candidature</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="dc-public-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=17"></script>
  <script src="../../assets/js/core/audit.js?v=17"></script>
  <script src="../../assets/js/core/utils.js?v=17"></script>
  <script src="../../assets/js/core/auth.js?v=17"></script>
  <script src="../../assets/js/core/notification-center.js?v=17"></script>
  <script src="../../assets/js/ui/forms.js?v=17"></script>
  <script src="../../assets/js/ui/layout.js?v=17"></script>
  <script>Layout.mountPublic("join-team");</script>
  <script src="../../assets/js/pages/page-join-team.js?v=17"></script>
</body>
</html>
