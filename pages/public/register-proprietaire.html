<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription propriétaire — DiaspoConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/css/variables.css?v=20" rel="stylesheet">
  <link href="../../assets/css/base.css?v=20" rel="stylesheet">
  <link href="../../assets/css/layout.css?v=20" rel="stylesheet">
  <link href="../../assets/css/components.css?v=20" rel="stylesheet">
  <link href="../../assets/css/pages.css?v=20" rel="stylesheet">
</head>
<body data-page="register-proprietaire">
  <script>window.DC_ROOT = "../../";</script>
  <div id="dc-public-navbar"></div>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <div class="text-center mb-4">
            <span class="dc-badge dc-badge-neutral mb-2" style="background:#ece9f6;color:#453970;">Inscription propriétaire</span>
            <h1 class="h3">Proposez un logement aux étudiants béninois et africains</h1>
            <p class="text-body-secondary">Chaque annonce est vérifiée par notre équipe avant publication.</p>
          </div>

          <form id="register-form" class="dc-form-section" novalidate>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="firstName" class="form-label dc-required">Prénom</label>
                <input type="text" class="form-control" id="firstName" name="firstName" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="lastName" class="form-label dc-required">Nom</label>
                <input type="text" class="form-control" id="lastName" name="lastName" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label dc-required">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label dc-required">Téléphone</label>
                <input type="tel" class="form-control" id="phone" name="phone" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="password" class="form-label dc-required">Mot de passe</label>
                <input type="password" class="form-control" id="password" name="password" minlength="6" required>
                <div class="invalid-feedback"></div>
              </div>
              <div class="col-md-6">
                <label for="city" class="form-label dc-required">Ville des biens proposés</label>
                <input type="text" class="form-control" id="city" name="city" required>
                <div class="invalid-feedback"></div>
              </div>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
              <label class="form-check-label small" for="terms">J'accepte que mes annonces soient soumises à modération avant publication.</label>
              <div class="invalid-feedback"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Créer mon compte propriétaire</button>
            <p class="small text-center mt-3 mb-0">Déjà un compte ? <a href="login.html">Se connecter</a></p>
          </form>
        </div>
      </div>
    </div>
  </main>

  <div id="dc-public-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/core/data-store.js?v=20"></script>
  <script src="../../assets/js/core/audit.js?v=20"></script>
  <script src="../../assets/js/core/utils.js?v=20"></script>
  <script src="../../assets/js/core/auth.js?v=20"></script>
  <script src="../../assets/js/core/permissions.js?v=20"></script>
  <script src="../../assets/js/core/notification-center.js?v=20"></script>
  <script src="../../assets/js/ui/forms.js?v=20"></script>
  <script src="../../assets/js/ui/layout.js?v=20"></script>
  <script>Layout.mountPublic("register-proprietaire");</script>
  <script src="../../assets/js/pages/page-register-proprietaire.js?v=20"></script>
</body>
</html>
